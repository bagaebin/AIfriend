<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dnilb · AI Chat Call</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="logo" aria-label="dnilb logo">dnilb</div>
        <button id="help-button" class="ghost-button" type="button">help</button>
      </header>

      <main class="layout" aria-label="chat and call layout">
        <section class="chat-shell" aria-label="chat with AI">
          <div class="chat-panel">
            <h2>Chat</h2>
            <div id="chat-log" class="chat-log" aria-live="polite"></div>
          </div>
          <form id="chat-form" class="chat-form">
            <input
              id="chat-input"
              type="text"
              placeholder="메시지를 입력하세요"
              autocomplete="off"
              required
              aria-label="chat input"
            />
            <button type="submit" class="primary-button">Send</button>
          </form>
        </section>

        <section class="call-shell" aria-label="call preview">
          <div class="portrait" role="img" aria-label="generated portrait">
            <img id="portrait-image" src="/avatars/default.svg" alt="사용자 초상" />
            <span class="chip chip--tag">you</span>
          </div>

          <div class="call-controls">
            <div class="bot-preview" aria-label="bot call tile">
              <div class="bot-avatar" aria-hidden="true"></div>
              <div class="bot-label">Bot</div>
            </div>
            <button id="call-reset" type="button" class="secondary-button">Call to another</button>
          </div>
        </section>
      </main>
    </div>

    <div id="help-modal" class="modal" aria-hidden="true" role="dialog" aria-label="작품 의도">
      <div class="modal__backdrop"></div>
      <div class="modal__dialog">
        <div class="modal__header">
          <h3>작품 의도</h3>
          <button id="help-close" class="ghost-button" type="button" aria-label="close help">✕</button>
        </div>
        <div class="modal__body">
          <p>
            이 인터페이스는 처음 만난 상대와 자연스럽게 대화하며, 대화 맥락을 바탕으로 비가시적인 이미지 프롬프트를 업데이트해
            아바타의 분위기를 잔잔히 변화시키는 실험적 콜 뷰입니다. 텍스트로는 이미지 생성에 대해 언급하지 않고, 실제 화상통화
            같은 친숙함에 집중합니다.
          </p>
        </div>
      </div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
